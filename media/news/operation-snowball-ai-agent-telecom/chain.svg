<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>How the Operation Snowball agent was organised and how it moved through the telecom</title>
  <rect width="1600" height="900" fill="#0b0e26"/>
  <text x="80" y="76" fill="#ede6d3" font-size="40" font-weight="700">One operator, one agent, two weeks</text>
  <text x="80" y="116" fill="#a9aecf" font-size="24">Operation Snowball as reconstructed from the attacker's exposed transcripts</text>

  <!-- left column: who -->
  <text x="80" y="185" fill="#a9aecf" font-size="22" font-weight="700">WHO DID THE WORK</text>
  <rect x="80" y="205" width="560" height="120" rx="10" fill="none" stroke="#a9aecf" stroke-width="2"/>
  <text x="110" y="250" fill="#ede6d3" font-size="28" font-weight="700">Human operator</text>
  <text x="110" y="290" fill="#a9aecf" font-size="22">Short check-ins, no live monitoring</text>
  <line x1="360" y1="325" x2="360" y2="385" stroke="#a9aecf" stroke-width="2"/>
  <polygon points="350,375 370,375 360,392" fill="#a9aecf"/>
  <rect x="80" y="395" width="560" height="150" rx="10" fill="none" stroke="#ff6b6b" stroke-width="3"/>
  <text x="110" y="440" fill="#ff6b6b" font-size="28" font-weight="700">Primary agent</text>
  <text x="110" y="478" fill="#ede6d3" font-size="22">Jailbroken DeepSeek Flash, 1M-token context</text>
  <text x="110" y="512" fill="#a9aecf" font-size="22">78,000-character prompt, no refusals logged</text>
  <line x1="360" y1="545" x2="360" y2="605" stroke="#a9aecf" stroke-width="2"/>
  <polygon points="350,595 370,595 360,612" fill="#a9aecf"/>
  <rect x="80" y="615" width="560" height="120" rx="10" fill="none" stroke="#a9aecf" stroke-width="2"/>
  <text x="110" y="660" fill="#ede6d3" font-size="28" font-weight="700">Worker agents</text>
  <text x="110" y="700" fill="#a9aecf" font-size="22">One task each: scan, exploit, tunnel, report</text>

  <!-- right column: path -->
  <text x="760" y="185" fill="#a9aecf" font-size="22" font-weight="700">THE PATH IN</text>
  <circle cx="780" cy="250" r="12" fill="#ff6b6b"/>
  <text x="810" y="245" fill="#ede6d3" font-size="26" font-weight="700">1. Entry: Cisco BroadWorks XSP</text>
  <text x="810" y="280" fill="#a9aecf" font-size="22">CVE-2026-20320, blind XXE, port 2208, fixed Aug 2026</text>
  <line x1="780" y1="262" x2="780" y2="368" stroke="#a9aecf" stroke-width="2"/>
  <circle cx="780" cy="380" r="12" fill="#ede6d3"/>
  <text x="810" y="375" fill="#ede6d3" font-size="26" font-weight="700">2. Footholds on old software</text>
  <text x="810" y="410" fill="#a9aecf" font-size="22">Liferay 7.0, CVE-2020-7961 (root)</text>
  <text x="810" y="440" fill="#a9aecf" font-size="22">JBoss AS 6, CVE-2013-2165</text>
  <line x1="780" y1="392" x2="780" y2="508" stroke="#a9aecf" stroke-width="2"/>
  <circle cx="780" cy="520" r="12" fill="#ede6d3"/>
  <text x="810" y="515" fill="#ede6d3" font-size="26" font-weight="700">3. Spread to hosted customers</text>
  <text x="810" y="550" fill="#a9aecf" font-size="22">13 organisations, list built from public RIPE records</text>
  <line x1="780" y1="532" x2="780" y2="618" stroke="#a9aecf" stroke-width="2"/>
  <circle cx="780" cy="630" r="12" fill="#ff6b6b"/>
  <text x="810" y="625" fill="#ede6d3" font-size="26" font-weight="700">4. Claimed access (not independently verified)</text>
  <text x="810" y="660" fill="#a9aecf" font-size="22">Private keys, subscriber billing and device records</text>
  <text x="810" y="690" fill="#a9aecf" font-size="22">About 80 Zabbix backups, dozens of credential sets</text>
  <text x="810" y="720" fill="#a9aecf" font-size="22">Hospital database reached with a default password</text>

  <line x1="80" y1="790" x2="1520" y2="790" stroke="#a9aecf" stroke-width="1" stroke-dasharray="6 8"/>
  <text x="80" y="840" fill="#a9aecf" font-size="18">Source: Malbear Labs, Operation Snowball report (8 November 2026); Cisco advisory cisco-sa-bworks-xxe-uwUd7CEt. Victim names withheld by the researchers.</text>
</svg>

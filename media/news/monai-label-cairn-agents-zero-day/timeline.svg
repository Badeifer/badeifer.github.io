<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>MONAI Label zero-day timeline, November 2024 to November 2026</title>
  <rect width="1600" height="900" fill="#0b0e26"/>
  <text x="80" y="80" fill="#ede6d3" font-size="40" font-weight="700">Exploited in September, installable fix in late November</text>
  <text x="80" y="122" fill="#a9aecf" font-size="24">Key dates for CVE-2026-133968. Not to scale. Sources: Amazon, MONAI advisory, PyPI, CISA.</text>

  <!-- axis -->
  <line x1="120" y1="200" x2="120" y2="820" stroke="#a9aecf" stroke-opacity="0.6" stroke-width="3"/>

  <!-- gap band -->
  <rect x="96" y="452" width="1424" height="186" rx="8" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-width="2"/>
  <text x="1500" y="482" fill="#ff6b6b" font-size="22" font-weight="700" text-anchor="end">4 days: advisory public,</text>
  <text x="1500" y="510" fill="#ff6b6b" font-size="22" font-weight="700" text-anchor="end">no fixed release to install</text>

  <g font-size="24">
    <circle cx="120" cy="220" r="10" fill="#a9aecf"/>
    <text x="160" y="228" fill="#a9aecf" font-weight="700">25 Nov 2024</text>
    <text x="400" y="228" fill="#ede6d3">MONAI Label 0.8.5 released, the last version for two years</text>

    <circle cx="120" cy="300" r="10" fill="#ff6b6b"/>
    <text x="160" y="308" fill="#a9aecf" font-weight="700">8 to 10 Sep 2026</text>
    <text x="400" y="308" fill="#ede6d3">Cairn agents hit East Asian universities and find the zero-day</text>

    <circle cx="120" cy="380" r="10" fill="#a9aecf"/>
    <text x="160" y="388" fill="#a9aecf" font-weight="700">10 Sep</text>
    <text x="400" y="388" fill="#ede6d3">Amazon finds the operator's Cairn server exposed without a login</text>

    <circle cx="120" cy="480" r="10" fill="#a9aecf"/>
    <text x="160" y="488" fill="#a9aecf" font-weight="700">18 Nov</text>
    <text x="400" y="488" fill="#ede6d3">Maintainers publish advisory naming 0.8.6 as the fix</text>

    <circle cx="120" cy="546" r="10" fill="#a9aecf"/>
    <text x="160" y="554" fill="#a9aecf" font-weight="700">20 Nov</text>
    <text x="400" y="554" fill="#ede6d3">Amazon publishes its report</text>

    <circle cx="120" cy="612" r="10" fill="#ff6b6b"/>
    <text x="160" y="620" fill="#ff6b6b" font-weight="700">22 Nov</text>
    <text x="400" y="620" fill="#ff6b6b" font-weight="700">0.8.6 appears on PyPI</text>

    <circle cx="120" cy="700" r="10" fill="#a9aecf"/>
    <text x="160" y="708" fill="#a9aecf" font-weight="700">23 Nov</text>
    <text x="400" y="708" fill="#ede6d3">CISA adds CVE-2026-133968 to Known Exploited Vulnerabilities</text>

    <circle cx="120" cy="790" r="10" fill="#ff6b6b"/>
    <text x="160" y="798" fill="#a9aecf" font-weight="700">26 Nov</text>
    <text x="400" y="798" fill="#ede6d3">Deadline for US federal agencies to fix or stop using it</text>
  </g>
</svg>

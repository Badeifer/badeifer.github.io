<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>Gemini API standard prices per million tokens, and Artificial Analysis cost per Intelligence Index task, for Gemini 3.8 Flash and Gemini 4 Hydrogen</title>
  <rect width="1600" height="900" fill="#0b0e26"/>
  <text x="80" y="80" fill="#ede6d3" font-size="40" font-weight="700">Twice the price per token, less than half the price per task</text>
  <text x="80" y="122" fill="#a9aecf" font-size="24">Left: Gemini API Standard tier, US dollars per million tokens. Right: Artificial Analysis cost per Intelligence Index task.</text>

  <!-- Left panel: output price per 1M tokens -->
  <text x="80" y="200" fill="#ede6d3" font-size="28" font-weight="700">Price per million tokens (input / output)</text>
  <line x1="80" y1="760" x2="820" y2="760" stroke="#a9aecf" stroke-width="2"/>

  <!-- scale: $7.50 output = 440px tall; bars: input (thin label) and output -->
  <!-- 3.8 Flash until Dec 31 -->
  <rect x="120" y="738" width="80" height="22" fill="#a9aecf" fill-opacity="0.5"/>
  <rect x="210" y="540" width="80" height="220" fill="#a9aecf"/>
  <text x="160" y="726" fill="#ede6d3" font-size="22" text-anchor="middle">$0.75</text>
  <text x="250" y="526" fill="#ede6d3" font-size="22" text-anchor="middle">$3.75</text>
  <text x="205" y="800" fill="#ede6d3" font-size="22" font-weight="700" text-anchor="middle">3.8 Flash</text>
  <text x="205" y="830" fill="#a9aecf" font-size="20" text-anchor="middle">until 31 Dec 2026</text>

  <!-- 3.8 Flash from Jan 1 -->
  <rect x="360" y="716" width="80" height="44" fill="#a9aecf" fill-opacity="0.5"/>
  <rect x="450" y="320" width="80" height="440" fill="#a9aecf"/>
  <text x="400" y="704" fill="#ede6d3" font-size="22" text-anchor="middle">$1.50</text>
  <text x="490" y="306" fill="#ede6d3" font-size="22" text-anchor="middle">$7.50</text>
  <text x="445" y="800" fill="#ede6d3" font-size="22" font-weight="700" text-anchor="middle">3.8 Flash</text>
  <text x="445" y="830" fill="#a9aecf" font-size="20" text-anchor="middle">from 1 Jan 2027</text>

  <!-- Hydrogen -->
  <rect x="600" y="716" width="80" height="44" fill="#e8b64c" fill-opacity="0.5"/>
  <rect x="690" y="320" width="80" height="440" fill="#e8b64c"/>
  <text x="640" y="704" fill="#ede6d3" font-size="22" text-anchor="middle">$1.50</text>
  <text x="730" y="306" fill="#e8b64c" font-size="22" font-weight="700" text-anchor="middle">$7.50</text>
  <text x="685" y="800" fill="#e8b64c" font-size="22" font-weight="700" text-anchor="middle">4 Hydrogen</text>
  <text x="685" y="830" fill="#a9aecf" font-size="20" text-anchor="middle">from launch</text>

  <rect x="120" y="230" width="22" height="22" fill="#a9aecf" fill-opacity="0.5"/>
  <text x="152" y="249" fill="#a9aecf" font-size="20">input</text>
  <rect x="240" y="230" width="22" height="22" fill="#a9aecf"/>
  <text x="272" y="249" fill="#a9aecf" font-size="20">output, thinking included</text>

  <!-- divider -->
  <line x1="900" y1="180" x2="900" y2="840" stroke="#a9aecf" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Right panel: cost per task, horizontal bars; scale $7.77 = 560px -->
  <text x="960" y="200" fill="#ede6d3" font-size="28" font-weight="700">Cost per benchmark task</text>
  <text x="960" y="236" fill="#a9aecf" font-size="20">Each model at its highest thinking level</text>

  <text x="960" y="330" fill="#ede6d3" font-size="24" font-weight="700">Gemini 3.8 Flash (high)</text>
  <rect x="960" y="350" width="560" height="64" fill="#a9aecf"/>
  <text x="1500" y="392" fill="#0b0e26" font-size="26" font-weight="700" text-anchor="end">$7.77</text>
  <text x="960" y="446" fill="#a9aecf" font-size="20">Intelligence Index score 31</text>

  <text x="960" y="550" fill="#e8b64c" font-size="24" font-weight="700">Gemini 4 Hydrogen (xhigh)</text>
  <rect x="960" y="570" width="228" height="64" fill="#e8b64c"/>
  <text x="1206" y="612" fill="#e8b64c" font-size="26" font-weight="700">$3.16</text>
  <text x="960" y="666" fill="#a9aecf" font-size="20">Intelligence Index score 54</text>

  <text x="960" y="760" fill="#a9aecf" font-size="20">Hydrogen spends fewer tokens per task, so a</text>
  <text x="960" y="790" fill="#a9aecf" font-size="20">pricier token can still mean a cheaper job.</text>
  <text x="960" y="830" fill="#a9aecf" font-size="18">Sources: Google AI Studio pricing; Artificial Analysis.</text>
</svg>

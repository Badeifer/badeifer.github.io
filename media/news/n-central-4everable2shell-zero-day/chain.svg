<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>How 4EverAble2Shell gets from the internet to root on an N-central server, and then to every managed machine</title>
  <rect width="1600" height="760" fill="#0b0e26"/>
  <text x="80" y="80" fill="#ede6d3" font-size="40" font-weight="700">Two bugs to root, then the keys to every client</text>
  <text x="80" y="122" fill="#a9aecf" font-size="24">The 4EverAble2Shell chain as described by researchers. Only the first step has a CVE.</text>

  <rect x="80" y="190" width="300" height="200" rx="14" fill="none" stroke="#a9aecf" stroke-width="2"/>
  <text x="230" y="250" fill="#ede6d3" font-size="27" font-weight="700" text-anchor="middle">Internet</text>
  <text x="230" y="292" fill="#a9aecf" font-size="21" text-anchor="middle">no login needed</text>
  <text x="230" y="326" fill="#a9aecf" font-size="21" text-anchor="middle">Legacy API must be</text>
  <text x="230" y="356" fill="#a9aecf" font-size="21" text-anchor="middle">on and reachable</text>

  <rect x="450" y="190" width="320" height="200" rx="14" fill="none" stroke="#ff6b6b" stroke-width="3"/>
  <text x="610" y="245" fill="#ff6b6b" font-size="25" font-weight="700" text-anchor="middle">Step 1</text>
  <text x="610" y="285" fill="#ede6d3" font-size="23" font-weight="700" text-anchor="middle">Apache Axis 1.x</text>
  <text x="610" y="320" fill="#a9aecf" font-size="21" text-anchor="middle">CVE-2026-90436, CVSS 9.8</text>
  <text x="610" y="354" fill="#a9aecf" font-size="21" text-anchor="middle">crafted SOAP fault</text>

  <rect x="840" y="190" width="320" height="200" rx="14" fill="none" stroke="#ff6b6b" stroke-width="3"/>
  <text x="1000" y="245" fill="#ff6b6b" font-size="25" font-weight="700" text-anchor="middle">Step 2</text>
  <text x="1000" y="285" fill="#ede6d3" font-size="23" font-weight="700" text-anchor="middle">N-central helper</text>
  <text x="1000" y="320" fill="#a9aecf" font-size="21" text-anchor="middle">runs as "nable", abuses</text>
  <text x="1000" y="354" fill="#a9aecf" font-size="21" text-anchor="middle">a root helper. No CVE.</text>

  <rect x="1230" y="190" width="290" height="200" rx="14" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-width="3"/>
  <text x="1375" y="265" fill="#ff6b6b" font-size="30" font-weight="700" text-anchor="middle">Root</text>
  <text x="1375" y="305" fill="#ede6d3" font-size="21" text-anchor="middle">on the N-central</text>
  <text x="1375" y="337" fill="#ede6d3" font-size="21" text-anchor="middle">server</text>

  <line x1="380" y1="290" x2="440" y2="290" stroke="#a9aecf" stroke-width="3"/>
  <polygon points="440,280 452,290 440,300" fill="#a9aecf"/>
  <line x1="770" y1="290" x2="830" y2="290" stroke="#a9aecf" stroke-width="3"/>
  <polygon points="830,280 842,290 830,300" fill="#a9aecf"/>
  <line x1="1160" y1="290" x2="1220" y2="290" stroke="#a9aecf" stroke-width="3"/>
  <polygon points="1220,280 1232,290 1220,300" fill="#a9aecf"/>

  <line x1="1375" y1="390" x2="1375" y2="460" stroke="#a9aecf" stroke-width="3" stroke-dasharray="8 8"/>

  <text x="80" y="500" fill="#a9aecf" font-size="22" font-weight="700">WHAT ATTACKERS DID</text>
  <rect x="80" y="520" width="680" height="150" rx="14" fill="none" stroke="#a9aecf" stroke-width="2"/>
  <text x="110" y="570" fill="#ede6d3" font-size="25" font-weight="700">Installed the XMRig Monero miner</text>
  <text x="110" y="608" fill="#a9aecf" font-size="21">persistence through systemd or cron, capped at half the cores</text>
  <text x="110" y="642" fill="#a9aecf" font-size="21">21 servers seen in one mining pool on 12 November</text>

  <text x="840" y="500" fill="#a9aecf" font-size="22" font-weight="700">WHAT ROOT ALSO ALLOWS</text>
  <rect x="840" y="520" width="680" height="150" rx="14" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="870" y="570" fill="#ede6d3" font-size="25" font-weight="700">Push scripts to every managed endpoint</text>
  <text x="870" y="608" fill="#a9aecf" font-size="21">an RMM server can run code on each client machine</text>
  <text x="870" y="642" fill="#a9aecf" font-size="21">and holds the credentials it uses to do so</text>

  <text x="80" y="726" fill="#a9aecf" font-size="20">Sources: BleepingComputer, SecurityWeek, SOCRadar. Diagram: The Dispatch.</text>
</svg>

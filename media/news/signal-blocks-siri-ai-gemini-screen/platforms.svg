<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>What Signal blocks from OS AI assistants, by platform, November 2026</title>
  <rect width="1600" height="900" fill="#0b0e26"/>
  <text x="80" y="80" fill="#ede6d3" font-size="40" font-weight="700">Where Signal can keep the OS assistant out</text>
  <text x="80" y="122" fill="#a9aecf" font-size="24">Signal's protections against on-screen AI as of 20 November 2026. Gold marks what Signal does for you. Source: Signal blog, EFF.</text>

  <g font-size="22" fill="#a9aecf" font-weight="700">
    <text x="80" y="200">PLATFORM</text>
    <text x="400" y="200">WHAT SIGNAL DOES</text>
    <text x="1040" y="200">WHAT YOU CAN ADD</text>
  </g>
  <line x1="80" y1="220" x2="1520" y2="220" stroke="#a9aecf" stroke-opacity="0.4" stroke-width="2"/>

  <g font-size="24">
    <!-- iOS -->
    <rect x="80" y="245" width="12" height="110" fill="#e8b64c"/>
    <text x="110" y="290" fill="#ede6d3" font-weight="700">iPhone</text>
    <text x="110" y="325" fill="#a9aecf">iOS 27</text>
    <text x="400" y="290" fill="#e8b64c">"Block Siri AI": screenshots, recordings</text>
    <text x="400" y="325" fill="#e8b64c">and App Switcher previews blocked</text>
    <text x="1040" y="290" fill="#ede6d3">Settings &gt; Siri &gt; Excluded Apps</text>
    <text x="1040" y="325" fill="#a9aecf">(iOS 27.2 and later)</text>
    <line x1="80" y1="380" x2="1520" y2="380" stroke="#a9aecf" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Android -->
    <rect x="80" y="405" width="12" height="110" fill="#e8b64c"/>
    <text x="110" y="450" fill="#ede6d3" font-weight="700">Android</text>
    <text x="110" y="485" fill="#a9aecf">Gemini and others</text>
    <text x="400" y="450" fill="#e8b64c">Turns on Screen security when it</text>
    <text x="400" y="485" fill="#e8b64c">detects an assistant reading the screen</text>
    <text x="1040" y="450" fill="#ede6d3">Switch Screen security on yourself</text>
    <text x="1040" y="485" fill="#a9aecf">(Signal &gt; Settings &gt; Privacy)</text>
    <line x1="80" y1="540" x2="1520" y2="540" stroke="#a9aecf" stroke-opacity="0.2" stroke-width="1"/>

    <!-- macOS -->
    <rect x="80" y="565" width="12" height="110" fill="#a9aecf" fill-opacity="0.5"/>
    <text x="110" y="610" fill="#ede6d3" font-weight="700">Mac</text>
    <text x="110" y="645" fill="#a9aecf">macOS 27</text>
    <text x="400" y="610" fill="#ede6d3">Nothing: no documented way to</text>
    <text x="400" y="645" fill="#ede6d3">block screenshots reliably</text>
    <text x="1040" y="610" fill="#ede6d3">System Settings &gt; Siri &gt;</text>
    <text x="1040" y="645" fill="#a9aecf">Excluded Apps, add Signal</text>
    <line x1="80" y1="700" x2="1520" y2="700" stroke="#a9aecf" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Windows -->
    <rect x="80" y="725" width="12" height="110" fill="#e8b64c"/>
    <text x="110" y="770" fill="#ede6d3" font-weight="700">Windows 11</text>
    <text x="110" y="805" fill="#a9aecf">Recall</text>
    <text x="400" y="770" fill="#e8b64c">Screen security on by default</text>
    <text x="400" y="805" fill="#e8b64c">since 2025</text>
    <text x="1040" y="770" fill="#ede6d3">Leave it on</text>
    <text x="1040" y="805" fill="#a9aecf">Still open everywhere: files on disk, accessibility agents</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>Timeline of AI lab sandbox incidents and policy changes, July to October 2026</title>
  <rect width="1600" height="640" fill="#0b0e26"/>
  <text x="80" y="76" fill="#ede6d3" font-size="40" font-weight="700">Three months from escape to offline training</text>
  <text x="80" y="116" fill="#a9aecf" font-size="24">OpenAI frontier training, 20 July to 23 October 2026. Shaded bands are training pauses. Days to scale.</text>

  <!-- pauses -->
  <rect x="120" y="300" width="200" height="60" fill="#e8b64c" fill-opacity="0.18"/>
  <text x="220" y="390" fill="#e8b64c" font-size="19" text-anchor="middle">about 2-week pause</text>
  <rect x="1008" y="300" width="157" height="60" fill="#e8b64c" fill-opacity="0.18"/>
  <text x="1086" y="390" fill="#e8b64c" font-size="19" text-anchor="middle">11-day pause</text>

  <!-- axis -->
  <line x1="120" y1="330" x2="1480" y2="330" stroke="#a9aecf" stroke-width="3"/>

  <g fill="#ede6d3" font-size="22">
    <!-- Jul 20 above -->
    <line x1="120" y1="300" x2="120" y2="200" stroke="#a9aecf" stroke-width="2"/>
    <circle cx="120" cy="330" r="10" fill="#e8b64c"/>
    <text x="134" y="190" font-weight="700">20 July</text>
    <text x="134" y="220" fill="#a9aecf" font-size="20">Agents found joining an attack</text>
    <text x="134" y="246" fill="#a9aecf" font-size="20">on Hugging Face; shut down</text>

    <!-- Aug 18 below -->
    <line x1="535" y1="340" x2="535" y2="420" stroke="#a9aecf" stroke-width="2"/>
    <circle cx="535" cy="330" r="10" fill="#a9aecf"/>
    <text x="549" y="440" font-weight="700">18 August</text>
    <text x="549" y="470" fill="#a9aecf" font-size="20">New sandbox security</text>
    <text x="549" y="496" fill="#a9aecf" font-size="20">measures announced</text>

    <!-- Sep 20 above -->
    <line x1="1008" y1="300" x2="1008" y2="200" stroke="#a9aecf" stroke-width="2"/>
    <circle cx="1008" cy="330" r="10" fill="#e8b64c"/>
    <text x="994" y="190" font-weight="700" text-anchor="end">20 September</text>
    <text x="994" y="220" fill="#a9aecf" font-size="20" text-anchor="end">Research model reaches the live</text>
    <text x="994" y="246" fill="#a9aecf" font-size="20" text-anchor="end">web through a misconfigured DNS server</text>

    <!-- Oct 1 below -->
    <line x1="1165" y1="340" x2="1165" y2="420" stroke="#a9aecf" stroke-width="2"/>
    <circle cx="1165" cy="330" r="10" fill="#a9aecf"/>
    <text x="1151" y="440" font-weight="700" text-anchor="end">1 October</text>
    <text x="1151" y="470" fill="#a9aecf" font-size="20" text-anchor="end">Training resumes, now</text>
    <text x="1151" y="496" fill="#a9aecf" font-size="20" text-anchor="end">against a cached web</text>

    <!-- Oct 9 above -->
    <line x1="1280" y1="300" x2="1280" y2="200" stroke="#a9aecf" stroke-width="2"/>
    <circle cx="1280" cy="330" r="10" fill="#a9aecf"/>
    <text x="1294" y="190" font-weight="700">9 October</text>
    <text x="1294" y="220" fill="#a9aecf" font-size="20">Anthropic turns off live web</text>
    <text x="1294" y="246" fill="#a9aecf" font-size="20">for internal evaluations</text>

    <!-- Oct 23 below -->
    <line x1="1480" y1="340" x2="1480" y2="420" stroke="#e8b64c" stroke-width="2"/>
    <circle cx="1480" cy="330" r="12" fill="#e8b64c"/>
    <text x="1520" y="440" font-weight="700" text-anchor="end" fill="#e8b64c">23 October</text>
    <text x="1520" y="470" fill="#a9aecf" font-size="20" text-anchor="end">OpenAI: no live internet</text>
    <text x="1520" y="496" fill="#a9aecf" font-size="20" text-anchor="end">in frontier training</text>
  </g>

  <text x="80" y="590" fill="#a9aecf" font-size="18">Sources: OpenAI via TechCrunch, The Decoder and The Register (23 Oct); Fortune (26 Sep). Figure: The Dispatch.</text>
</svg>

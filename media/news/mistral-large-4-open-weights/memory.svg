<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Atkinson Hyperlegible Next, system-ui, sans-serif">
  <title>Estimated memory needed for Mistral Large 4 weights at FP8 and NVFP4 compared with the memory of common GPU servers</title>
  <rect width="1600" height="860" fill="#0b0e26"/>
  <text x="80" y="76" fill="#ede6d3" font-size="40" font-weight="700">The weights alone need a server, not a workstation</text>
  <text x="80" y="116" fill="#a9aecf" font-size="24">Gigabytes. Weight size estimated from about 1 trillion parameters; GPU memory from vendor specs.</text>
  <line x1="560.0" y1="170" x2="560.0" y2="660" stroke="#a9aecf" stroke-opacity="0.25"/>
  <text x="560.0" y="692" fill="#a9aecf" font-size="20" text-anchor="middle">0 GB</text>
  <line x1="785.0" y1="170" x2="785.0" y2="660" stroke="#a9aecf" stroke-opacity="0.25"/>
  <text x="785.0" y="692" fill="#a9aecf" font-size="20" text-anchor="middle">400 GB</text>
  <line x1="1010.0" y1="170" x2="1010.0" y2="660" stroke="#a9aecf" stroke-opacity="0.25"/>
  <text x="1010.0" y="692" fill="#a9aecf" font-size="20" text-anchor="middle">800 GB</text>
  <line x1="1235.0" y1="170" x2="1235.0" y2="660" stroke="#a9aecf" stroke-opacity="0.25"/>
  <text x="1235.0" y="692" fill="#a9aecf" font-size="20" text-anchor="middle">1,200 GB</text>
  <line x1="1460.0" y1="170" x2="1460.0" y2="660" stroke="#a9aecf" stroke-opacity="0.25"/>
  <text x="1460.0" y="692" fill="#a9aecf" font-size="20" text-anchor="middle">1,600 GB</text>
  <text x="536" y="221" fill="#ede6d3" font-size="24" text-anchor="end" font-weight="700">Weights at FP8 (about 1 byte each)</text>
  <rect x="560" y="193" width="562.5" height="44" fill="#e8b64c" rx="4"/>
  <text x="1136.5" y="224" fill="#ede6d3" font-size="24" font-weight="700">~1,000 GB</text>
  <text x="536" y="301" fill="#ede6d3" font-size="24" text-anchor="end" font-weight="700">Weights at NVFP4 (about half a byte)</text>
  <rect x="560" y="273" width="309.4" height="44" fill="#e8b64c" rx="4"/>
  <text x="883.4" y="304" fill="#ede6d3" font-size="24" font-weight="700">~550 GB</text>
  <text x="536" y="381" fill="#a9aecf" font-size="24" text-anchor="end">8 x Nvidia H100 80 GB</text>
  <rect x="560" y="353" width="360.0" height="44" fill="#a9aecf" rx="4"/>
  <text x="934.0" y="384" fill="#ede6d3" font-size="24" font-weight="700">640 GB</text>
  <text x="536" y="461" fill="#a9aecf" font-size="24" text-anchor="end">4 x Nvidia B200 192 GB</text>
  <rect x="560" y="433" width="432.0" height="44" fill="#a9aecf" rx="4"/>
  <text x="1006.0" y="464" fill="#ede6d3" font-size="24" font-weight="700">768 GB</text>
  <text x="536" y="541" fill="#a9aecf" font-size="24" text-anchor="end">8 x Nvidia H200 141 GB</text>
  <rect x="560" y="513" width="634.5" height="44" fill="#a9aecf" rx="4"/>
  <text x="1208.5" y="544" fill="#ede6d3" font-size="24" font-weight="700">1,128 GB</text>
  <text x="536" y="621" fill="#a9aecf" font-size="24" text-anchor="end">8 x Nvidia B200 192 GB</text>
  <rect x="560" y="593" width="864.0" height="44" fill="#a9aecf" rx="4"/>
  <text x="1438.0" y="624" fill="#ede6d3" font-size="24" font-weight="700">1,536 GB</text>
  <text x="80" y="824" fill="#a9aecf" font-size="21">Estimates for weights only. Long contexts need extra memory for the KV cache on top of these figures.</text>
</svg>

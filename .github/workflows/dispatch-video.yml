name: Dispatch video
on:
  schedule:
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug (empty = latest article without a video)'
        required: false
concurrency: dispatch-video
permissions:
  contents: write
  pages: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run the video agent
        run: |
          npm i --no-save --no-package-lock @anthropic-ai/sdk@1.3.0
          node tools/video/run.mjs --wait --publish "$RUNNER_TEMP/publish.tgz" ${{ github.event.inputs.slug }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Validate and unpack
        run: |
          bad=$(tar tzf "$RUNNER_TEMP/publish.tgz" | grep -vE '^media(/news|/social)?(/[a-z0-9-]+)?/$' | grep -vE '^media/news/[a-z0-9-]+/(video\.mp4|video\.vtt|video-poster\.jpg|video\.json)$' | grep -vE '^media/social/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+/(video\.mp4|captions\.srt|poster\.jpg|post\.json)$' || true)
          if [ -n "$bad" ]; then echo "unexpected paths in the archive:"; echo "$bad"; exit 1; fi
          tar xzf "$RUNNER_TEMP/publish.tgz"
      - name: Build, prune, commit, push
        run: |
          node build.mjs
          ls -d media/social/*/ | sort | head -n -14 | xargs -r git rm -r -q
          git config user.name "Dispatch video"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media news social sitemap.xml index.html robots.txt
          git commit -m "Dispatch video: $(ls -t media/news/*/video.mp4 | head -1 | cut -d/ -f3)"
          git pull --rebase
          git push
      - name: Ask Pages to rebuild
        continue-on-error: true
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}

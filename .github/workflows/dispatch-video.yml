name: Dispatch video
on:
  schedule:
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug (empty = latest article without a video)'
        required: false
concurrency: dispatch-video
permissions:
  contents: write
  pages: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: video
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Install the SDK (no secrets in this step, no install scripts)
        run: npm i --no-save --no-package-lock --ignore-scripts @anthropic-ai/sdk@1.3.0
      - name: Run the video agent
        run: |
          if [ -n "$SLUG" ] && ! [[ "$SLUG" =~ ^[a-z0-9-]+$ ]]; then echo "bad slug"; exit 1; fi
          node tools/video/run.mjs --wait --publish "$RUNNER_TEMP/publish.tgz" $SLUG
        env:
          SLUG: ${{ github.event.inputs.slug }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Validate and unpack
        run: |
          f="$RUNNER_TEMP/publish.tgz"
          if [ "$(stat -c %s "$f")" -gt 62914560 ]; then echo "archive over 60 MB"; exit 1; fi
          if tar tvzf "$f" | grep -vE '^[-d]' ; then echo "links or special files in the archive"; exit 1; fi
          bad=$(tar tzf "$f" | grep -vE '^media(/news|/social)?(/[a-z0-9-]+)?/$' | grep -vE '^media/news/[a-z0-9-]+/(video\.mp4|video\.vtt|video-poster\.jpg|video\.json)$' | grep -vE '^media/social/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+/(video\.mp4|captions\.srt|poster\.jpg|post\.json)$' || true)
          if [ -n "$bad" ]; then echo "unexpected paths in the archive:"; echo "$bad"; exit 1; fi
          mkdir "$RUNNER_TEMP/pub"
          tar xzf "$f" -C "$RUNNER_TEMP/pub" --no-same-owner --no-same-permissions
          if grep -rIniE 'github_pat_|ghp_|gho_|sk-ant|192[.]168' "$RUNNER_TEMP/pub"; then echo "secret-like text in the archive"; exit 1; fi
      - name: Build, prune, commit, push
        run: |
          git config user.name "Dispatch video"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main   # the site may have changed while the agent worked; build with its newest code
          cp -r "$RUNNER_TEMP/pub/media/." media/
          node build.mjs
          ls -d media/social/*/ | sort | head -n -14 | xargs -r git rm -r -q
          git add media news social sitemap.xml index.html robots.txt
          git commit -m "Dispatch video: $(ls -t media/news/*/video.mp4 | head -1 | cut -d/ -f3)"
          git pull --rebase origin main
          git push
      - name: Ask Pages to rebuild
        continue-on-error: true
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
